<header class="site-header fixed inset-x-0 top-0 z-50" [class.is-scrolled]="scrolled() || menuOpen()">
  <nav class="wrap h-16 flex items-center justify-between" aria-label="Principal">
    <a href="#inicio" (click)="closeMenu()" class="font-mono text-sm text-fg">ivan<span class="text-accent">.</span>armolla</a>

    <div class="hidden md:flex items-center gap-1">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" class="nav-link" [class.is-active]="active() === link.id"
          [attr.aria-current]="active() === link.id ? 'location' : null">{{ link.label }}</a>
      }
      <a href="assets/ivanarmolla.pdf" target="_blank" rel="noopener" class="nav-link">CV</a>
      <button type="button" class="icon-btn" (click)="themeService.toggle($event)"
        [attr.aria-label]="themeService.isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
        [title]="themeService.isDark() ? 'Tema claro' : 'Tema oscuro'">
        <i class="fa-solid" [class.fa-sun]="themeService.isDark()" [class.fa-moon]="!themeService.isDark()" aria-hidden="true"></i>
      </button>
      <a href="#contacto" class="btn-primary !py-2 ml-2 text-sm">Contacto</a>
    </div>

    <div class="flex md:hidden items-center gap-1">
      <button type="button" class="icon-btn" (click)="themeService.toggle($event)"
        [attr.aria-label]="themeService.isDark() ? 'Activar tema claro' : 'Activar tema oscuro'">
        <i class="fa-solid" [class.fa-sun]="themeService.isDark()" [class.fa-moon]="!themeService.isDark()" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
        <i class="fa-solid" [class.fa-bars]="!menuOpen()" [class.fa-xmark]="menuOpen()" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
  <div class="scroll-progress" aria-hidden="true"></div>

  @if (menuOpen()) {
    <div id="mobile-menu" class="mobile-menu md:hidden border-t border-line">
      <div class="wrap py-4 flex flex-col gap-1">
        @for (link of links; track link.id) {
          <a [href]="'#' + link.id" (click)="closeMenu()" class="nav-link !text-base !py-3" [class.is-active]="active() === link.id">{{ link.label }}</a>
        }
        <a href="assets/ivanarmolla.pdf" target="_blank" rel="noopener" (click)="closeMenu()" class="nav-link !text-base !py-3">CV</a>
        <a href="#contacto" (click)="closeMenu()" class="btn-primary justify-center mt-2">Contacto</a>
      </div>
    </div>
  }
</header>
